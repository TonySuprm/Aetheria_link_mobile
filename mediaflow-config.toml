# MediaFlow Proxy Light — runtime configuration for Aetheria Link.
# Copy of config-example.toml tuned for the bundled Docker image.

[server]
host = "127.0.0.1"
port = 8890
workers = 4

[proxy]
connect_timeout = 30
follow_redirects = true
buffer_size = 262144
proxy_url = ""
all_proxy = false

request_timeout_factor = 8
max_concurrent_per_host = 10
pool_idle_timeout = 90
pool_max_idle_per_host = 100
body_read_timeout = 60

[auth]
api_password = "aetheria-link-secret"

[hls]
prebuffer_segments = 5
prebuffer_cache_size = 50
segment_cache_ttl = 300
inactivity_timeout = 60

[mpd]
live_playlist_depth = 8
live_init_cache_ttl = 60
remux_to_ts = false

[drm]
key_cache_ttl = 3600

[redis]
url = ""
cache_namespace = ""

[telegram]
api_id = 0
api_hash = ""
session_string = ""
max_connections = 8

[acestream]
host = "localhost"
port = 6878
buffer_size = 4194304

[transcode]
enabled = true
prefer_gpu = true
video_bitrate = "4M"
audio_bitrate = 192000

[extractor]
byparr_timeout = 60
